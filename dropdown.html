<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=menu" />
    <title>Document</title>
    <style>
        *{
            margin: 0;
        }
        .menu{
            width: 30vh;
        }
        .menu h3{
            background-color: blue;
            color: white;
            padding: 11px;
        }
        .icon{
            float: right;
            cursor:zoom-in ;
        }
        .icon ul{
            list-style-type: none;
        }
        .items li{
            padding: 10px 20px;
            background-color: blue;
            margin-bottom: 1px 0;
            margin-left: -40px;
        }
        .items a{
            color: white;
            text-decoration: none;
            font-family:Verdana;
        }
        .items{
            display: none;
        }
        .menu:hover .items{
            display: inline;
           
        }
    </style>
</head>
<body>
    <div class="menu">
        <h3>Menu<span class="material-symbols-outlined icon">menu</span></h3>
        <div class="items">
            <ul>
                <li><a href="#">Home</a></li>
                <li><a href="#">About</a></li>
                <li><a href="#">Profile</a></li>
                <li><a href="#">Contacts Us</a></li>
            </ul>
        </div>
    </div>
</body>
</html>
