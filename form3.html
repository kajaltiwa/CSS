<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <form action="">
        <div>
            <label>
                <input type="radio" name="gender" value="Male" id="male" checked>
                <label>Male</label>

                <input type="radio" name="gender" value="female" id="female">
                <label>Female</label>

                <input type="radio" name="gender" value="other" id="other">
                <label>Other</label>
            </label>
            <div>
                <label>Subject</label>

                <input type="checkbox" name="mern" id="mern">
                <label>Mern</label>

                <input type="checkbox" name="mean" id="mean" checked>
                <label>Mean</label>

                <input type="checkbox" name="Python" id="Python">
                <label for="Python">Python</label>

                <input type="checkbox" name="Java" id="java" checked>
                <label for="java">Java</label>
            </div>

            <div>
                <label>Color</label>
                <input type="color" value="color">
            </div>

            <div>
                <label>Range</label>
                <input type="range" name="range" min="1" max="100" value="45">
            </div>

            <div>
                <input type="hidden" name="id" value="123">
            </div>

        </div>

    </form>
</body>

</html>
