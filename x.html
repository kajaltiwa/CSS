<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
        }
        .main{
            width: 100vw;
            height: 300vh;

            display: grid;
            /* grid-template-columns: 100px 200px 300px auto; */
            grid-template-columns: auto auto auto auto;
            /* grid-template-rows: 100px auto auto auto 100px; */
            /* column-gap: 5px;
            row-gap: 4px; */
            gap: 5px;
        }
        #box1,#box14{
            grid-column: 1/4 span;
        }
        #box2,#box3,#box9,#box10,#box12{
            grid-column: 1/2 span;
        }
        #box3,#box10{
            grid-column-start: 3;
        }
        #box5{
            grid-row: 1/2 span;
            grid-column: 1/2 span;
            grid-column-start: 2;
            grid-row-start: 3;
        }
        #box12{
            grid-column-start: 2;
        }
        .box{
            background-color: cadetblue;
            color: aliceblue;
            display: grid;
            place-items: center;
        }

    </style>
</head>
<body>
  <div class="main">
    <div class="box" id="box1" ><img src="p1.jpg" alt=""></div>
    <div class="box" id="box2"><img src="p2.jpg" alt="" height="500px" width="500px"></div>
    <div class="box" id="box3"></div>
    <div class="box" id="box4"></div>
    <div class="box" id="box5"></div>
    <div class="box" id="box6"></div>
    <div class="box" id="box7"></div>
    <div class="box" id="box8"></div>
    <div class="box" id="box9"></div>
    <div class="box" id="box10"></div>
    <div class="box" id="box11"></div>
    <div class="box" id="box12"></div>
    <div class="box" id="box13"></div>
    <div class="box" id="box14"></div>
  </div>
</body>
</html>
