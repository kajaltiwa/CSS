<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
        }
        .main{
            width: 100vw;
            height: 100vh;
            display: grid; 
            place-items: center;
        }
        .center{
            height: 50%;
            width: 80%;
            background-color: antiquewhite;
           
        }
        .box{
            width: 70px;
            height: 70px;
            display: inline-block;
            color: rgb(13, 219, 219);
        }
        #box1{
           background-color: green; 
        }
        #box2{
           background-color: rgb(189, 52, 14);
           position: relative;
           top: 50px; 
           left: 20px;

        }
        #box3{
           background-color: rgb(92, 88, 125); 
        }
        #box4{
           background-color: rgb(15, 204, 204); 
        }
        #box5{
           background-color: green; 
        }
    </style>
</head>
<body>
    <div class="main">
        <div class="center">
            <div class="box" id="box1">Box1</div>
            <div class="box" id="box2">Box2</div>
            <div class="box" id="box3">Box3</div>
            <div class="box" id="box4">Box4</div>
            <div class="box" id="box5">Box5</div>
        </div>
    </div>
</body>
</html>
