<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <style>
        body{
            background-color: rgb(123, 210, 210);
        }
    </style>
   
    <h2>HTML Form</h2>
    <form action="">
        <label>First Name : &ensp;&ensp;&ensp;&ensp;&ensp; </label>
        <input type="text" name="name" id="name" style="border-radius: 3px;">

        <br> <br>

        <label>Last Name : &ensp;&ensp;&ensp;&ensp;&ensp; </label>
        <input type="text" name="lastname" id="lastname" style="border-radius: 3px;">

        <br> <br>

        <label>Date of Birth : &ensp;&ensp;&ensp;</label>
        <input type="text" name="date of Birth" id="Date" style="border-radius: 3px;">

        <br> <br>

        <label>Email id :&ensp;&ensp;&ensp;&ensp;&ensp;&ensp;&ensp;</label>
        <input type="email" name="email id" id="Email id" style="border-radius: 3px;">

        <br> <br>

        <label>Mobile Number :&ensp; </label>
        <input type="tel" name="mobile number" id="Mobile Number" pattern="[6-9]{1}[0-9]{9}" style="border-radius: 3px;">


        <br> <br> <br> <br>
        <button type="submit" style="border-radius: 3px;">SUBMIT</button>
        &ensp;&ensp;&ensp;&ensp;
        <button type="reset" style="border-radius: 3px;">RESET</button>
    </form>
</body>
</html>
