<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <style>
        .ab {
            border: 2px solid rgb(71, 71, 197);
            height: 400px;
            width: 400px;
            /* text-align: center;  */
            position: fixed;
            top: 20%;
            left: 30%;
            margin-left: 20px;
            border-radius: 20px;

        }
    </style>
    <form action="">
        <div class="ab">
            <h2 style="text-align: center; color: blue;">FaceBook Account</h2>
            <div>
                <label style="margin-left: 40px;">Email</label><br>
                <input type="email" name="Email" id="email" placeholder="example@gmail.com"
                    style="border-radius: 5px;width: 260px; height: 40px; margin-left: 40px;">
            </div>
            <br>
            <div>
                <label style="margin-left: 40px;">Password</label><br>
                <input type="password" name="Password" id="password" placeholder="Enter Your Password"
                    style="border-radius: 5px; width: 260px; height: 40px;margin-left: 40px;">
            </div>
            <br>
            <div>

                <input type="checkbox" name="Remender me" id="remender me"
                    style="border-radius: 5px;margin-left: 40px;">
                <label>Remender Me&ensp;&ensp;&ensp;&ensp;</label>
                <label style="color: rgb(217, 45, 45);"> Forgot Password?</label>
            </div>
            <br><br>
            <button type="button"
                style="width: 270px; height: 40px; border-radius: 5px; background-color: blue; margin-left: 40px;">Sign
                In</button>
        </div>
    </form>
</body>

</html>
